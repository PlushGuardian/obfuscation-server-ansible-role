---
- name: Install and configure UFW
  become: true
  tags: [ufw, security]
  block:
    - name: Ensure UFW is installed
      ansible.builtin.package:
        name: ufw
        state: present

    - name: Set default UFW policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: "{{ ufw_default_incoming_policy }}" }
        - { direction: outgoing, policy: "{{ ufw_default_outgoing_policy }}" }
      loop_control:
        label: "{{ item.direction }} -> {{ item.policy }}"
      notify: reload ufw

    - name: Block ICMP echo-request (ping) in ufw before.rules
      ansible.builtin.replace:
        path: "{{ ufw_before_rules_path }}"
        regexp: '^(-A {{ item }} -p icmp --icmp-type echo-request -j)\s*ACCEPT'
        replace: '\1 DROP'
        backup: true
      diff: true
      loop: "{{ ufw_block_icmp_chains }}"
      notify: reload ufw

    - name: Allow SSH / Ansible control port
      community.general.ufw:
        rule: allow
        port: "{{ ufw_ssh_port }}"
        proto: tcp
        comment: "Ansible-managed: SSH/control access"

    - name: Allow additional application ports
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto | default('tcp') }}"
        comment: "Ansible-managed extra rule"
      loop: "{{ ufw_extra_allow_rules }}"
      when: ufw_extra_allow_rules | length > 0

    - name: Ensure UFW is enabled
      community.general.ufw:
        state: enabled
