---
# Core setup: SSH hardening, admin users, firewall.
# Applies to every host this role runs against.
- import_tasks: ssh.yml
- import_tasks: admin_users.yml
- import_tasks: ufw.yml

# TODO configure headscale

# Multi-node connectivity (Tailscale) — skip on standalone installs.
- import_tasks: tailscale.yml
  when: is_cluster_installation | default(true)

# Monitoring agents — every host, when monitoring is enabled.
- import_tasks: node_exporter.yml
  when: enable_monitoring | default(true)
- import_tasks: vmagent.yml
  when: enable_monitoring | default(true)

# Metrics storage — only on hosts in the monitoring_servers group.
- import_tasks: victoriametrics.yml
  when:
    - enable_monitoring | default(true)
    - inventory_hostname in groups['monitoring_servers'] | default([])

# MTProxyMax — only on hosts in the mtproxymax_hosts group.
- import_tasks: mtproxymax.yml
  when: inventory_hostname in groups['mtproxymax_hosts'] | default([])

# 3X-UI — only on hosts in the x_ui_hosts group.
- import_tasks: x_ui.yml
  when: inventory_hostname in groups['x_ui_hosts'] | default([])
