---
# Core setup: SSH hardening, admin users, firewall.
# Applies to every host this role runs against.
- name: SSH hardening
  ansible.builtin.include_role:
    name: obfuscation_server
    tasks_from: ssh

- name: Admin users
  ansible.builtin.include_role:
    name: obfuscation_server
    tasks_from: admin_users

- name: UFW firewall
  ansible.builtin.include_role:
    name: obfuscation_server
    tasks_from: ufw

