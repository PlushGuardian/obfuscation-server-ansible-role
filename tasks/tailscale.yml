---
- name: Download Tailscale install script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/install-tailscale.sh
    mode: "0755"
  tags: [tailscale, monitoring]

- name: Run Tailscale installer
  ansible.builtin.command: /tmp/install-tailscale.sh
  args:
    creates: /usr/bin/tailscale
  environment:
    TAILSCALE_VERSION: "{{ tailscale_version }}"
  become: true
  tags: [tailscale, monitoring]

- name: Authenticate Tailscale with auth key
  ansible.builtin.command: tailscale up --accept-routes
  environment:
    TS_AUTHKEY: "{{ tailscale_auth_key }}"
  changed_when: false
  become: true
  no_log: true
  tags: [tailscale, monitoring]
