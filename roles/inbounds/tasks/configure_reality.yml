# ===========================================
#   GENERATE PRIVATE AND PUBLIC KEYS
# ===========================================

- name: Find Xray binary path
  ansible.builtin.shell: |
    if command -v xray >/dev/null 2>&1; then
      command -v xray
    elif [ -f /usr/local/x-ui/bin/xray-linux-amd64 ]; then
      echo /usr/local/x-ui/bin/xray-linux-amd64
    elif [ -f /usr/local/x-ui/bin/xray-linux-386 ]; then
      echo /usr/local/x-ui/bin/xray-linux-386
    elif [ -f /opt/x-ui/bin/xray-linux-amd64 ]; then
      echo /opt/x-ui/bin/xray-linux-amd64
    elif [ -f /usr/bin/xray ]; then
      echo /usr/bin/xray
    else
      echo "ERROR: Xray binary not found" >&2
      exit 1
    fi
  register: xray_path_result
  changed_when: false
  failed_when: xray_path_result.rc != 0

- name: Set xray_bin fact
  ansible.builtin.set_fact:
    xray_bin: "{{ xray_path_result.stdout_lines[0] }}"

- name: Generate Reality keys on the remote server (for new inbound)
  ansible.builtin.shell: "{{ xray_bin }} x25519"
  register: keygen_output
  changed_when: false
  when: existing_inbound is none

- name: Parse and set key variables (use existing keys if inbound exists)
  ansible.builtin.set_fact:
    reality_private_key: >-
      {{
        (existing_streamSettings.realitySettings.privateKey
         if existing_inbound is not none
         else keygen_output.stdout | regex_search('(?im)^\s*(?:private\s*key|privatekey):\s*(.*)$', '\1') | first)
      }}
    reality_public_key: >-
      {{
        (existing_streamSettings.realitySettings.settings.publicKey
         if existing_inbound is not none
         else keygen_output.stdout | regex_search('(?im)^\s*(?:public\s*key|password):\s*(.*)$', '\1') | first)
      }}

# ===========================================
#   GENERATE SHORTID
# ===========================================
- name: Generate shortId on the control node (for new inbound)
  ansible.builtin.set_fact:
    reality_short_ids: "{{ lookup('pipe', 'openssl rand -hex 8') }}"
  delegate_to: localhost
  when: existing_inbound is none

- name: Use existing shortIds if inbound exists
  ansible.builtin.set_fact:
    reality_short_ids: "{{ existing_streamSettings.realitySettings.shortIds[0] }}"
  when: existing_inbound is not none

- name: Ensure reality_short_ids is a list
  ansible.builtin.set_fact:
    reality_short_ids: [ "{{ reality_short_ids }}" ]

