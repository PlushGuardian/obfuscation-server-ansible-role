---
# tasks file for processing a single client

- name: Compute client email
  ansible.builtin.set_fact:
    client_email: >-
      {{
        client_item.name + '-' +
        (inbound_item.name + client_item.name) | hash('md5') | truncate(8, end='')
      }}

- name: Check if client exists by email
  ansible.builtin.set_fact:
    existing_client: "{{ existing_clients_by_email[client_email] | default(None) }}"

- name: Build client payload object
  ansible.builtin.set_fact:
    client_payload_obj:
      id: "{{ generated_uuids[client_item.name] }}"
      email: "{{ client_email }}"
      flow: "{{ client_flow }}"
      enable: true

- name: Convert client payload to JSON string (for settings field)
  ansible.builtin.set_fact:
    client_payload_string: "{{ {'clients': [client_payload_obj]} | to_json }}"

- name: Add new client via API
  ansible.builtin.uri:
    url: "{{ ui_panel_url }}/panel/api/inbounds/addClient"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      Content-Type: "application/json"
    body:
      id: "{{ inbound_id }}"
      settings: "{{ client_payload_string }}"
    body_format: json
    status_code: 200
  when: existing_client is none
  register: add_client_response
  failed_when: >-
    add_client_response.json is not defined or
    add_client_response.json.success != true

- name: Update existing client via API
  ansible.builtin.uri:
    url: "{{ ui_panel_url }}/panel/api/inbounds/updateClient/{{ existing_client.id }}"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      Content-Type: "application/json"
    body:
      id: "{{ inbound_id }}"
      settings: "{{ client_payload_string }}"
    body_format: json
    status_code: 200
  when: existing_client is not none
  register: update_client_response
  failed_when: >-
    update_client_response.json is not defined or
    update_client_response.json.success != true
