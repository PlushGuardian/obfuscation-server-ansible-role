# ===========================================
#   OPTIONAL SECOND INBOUND FOR EGRESS TRAFFIC
# ===========================================
- name: Check if egressInbound flag is true
  ansible.builtin.set_fact:
    create_egress_inbound: "{{ egressInbound | default(false) | bool }}"

- name: Generate unique port for egress inbound (if flag is true)
  ansible.builtin.shell: |
    while true; do
      PORT=$(shuf -i {{ port_range_start }}-{{ port_range_end }} -n 1)
      if ! ss -tuln | grep -q ":${PORT} " && ! ufw status | grep -q "${PORT}"; then
        echo $PORT
        break
      fi
    done
  register: egress_port_finder
  become: yes
  when: create_egress_inbound

- name: Construct payload for egress inbound
  ansible.builtin.set_fact:
    egress_inbound_payload:
      remark: "{{ inbound_item.name }}-egress"
      enable: true
      protocol: "{{ inbound_protocol }}"
      listen: "{{ egress_ip | default(inbound_listen_ip) }}"
      port: "{{ egress_port_finder.stdout | trim | int }}"
      expiryTime: 0
      total: 0
      up: 0
      down: 0
      settings: "{{ settings_string }}"               # same settings (no clients yet)
      streamSettings: "{{ streamSettings_string }}"   # same streamSettings
  when: create_egress_inbound

- name: Add egress inbound via API
  ansible.builtin.uri:
    url: "{{ ui_panel_url }}/panel/api/inbounds/add"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      Content-Type: "application/json"
    body: "{{ egress_inbound_payload | to_json }}"
    body_format: json
    status_code: 200
  register: egress_inbound_response
  when: create_egress_inbound
  failed_when: >-
    egress_inbound_response.json is not defined or
    egress_inbound_response.json.success != true


- name: Store egress inbound ID for later client processing
  ansible.builtin.set_fact:
    egress_inbound_id: "{{ egress_inbound_response.json.obj.id }}"
  when: create_egress_inbound

# You can later add clients to this inbound similarly, perhaps using a different list.
