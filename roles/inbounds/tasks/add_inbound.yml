# ===========================================
#   CHECK IF INBOUND ALREADY EXISTS
# ===========================================
- name: Get existing inbounds from 3X-UI
  ansible.builtin.uri:
    url: "{{ ui_panel_url }}/panel/api/inbounds/list"
    method: GET
    headers:
      Cookie: "{{ session_cookie }}"
    status_code: 200
  register: existing_inbounds_response
  failed_when: >-
    existing_inbounds_response.json is not defined or
    existing_inbounds_response.json.success != true

- name: Find inbound by remark
  ansible.builtin.set_fact:
    existing_inbound: >-
      {{
        existing_inbounds_response.json.obj
        | selectattr('remark', 'equalto', inbound_item.name)
        | first | default(None)
      }}

- name: Parse streamSettings and settings if inbound exists
  block:
    - name: Parse streamSettings from JSON string
      ansible.builtin.set_fact:
        existing_streamSettings: "{{ existing_inbound.streamSettings | from_json }}"
      when: existing_inbound is not none

    - name: Parse settings from JSON string (though we might not need it for inbound update)
      ansible.builtin.set_fact:
        existing_settings: "{{ existing_inbound.settings | from_json }}"
      when: existing_inbound is not none
  when: existing_inbound is not none

# ===========================================
#   GENERATE INBOUND-SPECIFIC VALUES (only if new)
# ===========================================
- name: Find an unused port in the range 10000-49151 (for new inbound)
  ansible.builtin.shell: |
    while true; do
      PORT=$(shuf -i {{ port_range_start }}-{{ port_range_end }} -n 1)
      if ! ss -tuln | grep -q ":${PORT} " && ! ufw status | grep -q "${PORT}"; then
        echo $PORT
        break
      fi
    done
  register: port_finder
  changed_when: false
  become: true
  failed_when: port_finder.rc != 0 or port_finder.stderr != ""
  when: existing_inbound is none

- name: Set inbound port as fact (use existing port if inbound exists)
  ansible.builtin.set_fact:
    inbound_port: >-
      {{
        existing_inbound.port | default(port_finder.stdout | trim)
      }}

- name: Configure Reality settings based on host IP
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure_reality.yaml"

# ===========================================
#   BUILD JSONS (WITHOUT CLIENTS)
# ===========================================
- name: Build settings dictionary (empty clients)
  ansible.builtin.set_fact:
    settings_dict:
      clients: []          # clients will be handled separately
      decryption: "none"
      fallbacks: []

- name: Build streamSettings dictionary
  ansible.builtin.set_fact:
    streamSettings_dict:
      network: "{{ inbound_network }}"
      security: "reality"
      realitySettings:
        show: false
        xver: 0
        target: "{{ reality_destination }}"
        serverNames: "{{ reality_server_names }}"
        privateKey: "{{ reality_private_key }}"
        shortIds: "{{ reality_short_ids }}"
        minClientVer: ""
        maxClientVer: ""
        maxTimeDiff: 0
        settings:
          publicKey: "{{ reality_public_key }}"
      tcpSettings:
        acceptProxyProtocol: false
        header:
          type: "none"

- name: Convert settings and streamSettings to JSON strings
  ansible.builtin.set_fact:
    settings_string: "{{ settings_dict | to_json }}"
    streamSettings_string: "{{ streamSettings_dict | to_json }}"

- name: Construct final inbound payload (no clients)
  ansible.builtin.set_fact:
    inbound_payload:
      remark: "{{ inbound_item.name }}"
      enable: true
      protocol: "{{ inbound_protocol }}"
      listen: "{{ ansible_host }}"
      port: "{{ inbound_port | int }}"
      expiryTime: 0
      total: 0
      up: 0
      down: 0
      settings: "{{ settings_string }}"
      streamSettings: "{{ streamSettings_string }}"

# ===========================================
#   ADD OR UPDATE INBOUND
# ===========================================
- name: Add new inbound via 3X-UI API
  ansible.builtin.uri:
    url: "{{ ui_panel_url }}/panel/api/inbounds/add"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      Content-Type: "application/json"
    body: "{{ inbound_payload | to_json }}"
    body_format: json
    status_code: 200
  register: add_inbound_response
  when: existing_inbound is none
  failed_when: >-
    add_inbound_response.json is not defined or
    add_inbound_response.json.success != true

- name: Allow the selected port through UFW (for new inbound)
  community.general.ufw:
    rule: allow
    port: "{{ port_finder.stdout | trim }}"
    proto: tcp
  become: true
  when: existing_inbound is none

- name: Update existing inbound via 3X-UI API
  ansible.builtin.uri:
    url: "{{ ui_panel_url }}/panel/api/inbounds/update/{{ existing_inbound.id }}"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      Content-Type: "application/json"
    body: "{{ inbound_payload | to_json }}"
    body_format: json
    status_code: 200
  register: update_inbound_response
  when: existing_inbound is not none
  failed_when: >-
    update_inbound_response.json is not defined or
    update_inbound_response.json.success != true

- name: Set inbound_id fact for later client operations
  ansible.builtin.set_fact:
    inbound_id: >-
      {{
        (existing_inbound.id if existing_inbound is not none
         else add_inbound_response.json.obj.id)
      }}

# ===========================================
#   GET EXISTING CLIENTS FOR THIS INBOUND
# ===========================================
- name: Get current inbound details (to fetch existing clients)
  ansible.builtin.uri:
    url: "{{ ui_panel_url }}/panel/api/inbounds/get/{{ inbound_id }}"
    method: GET
    headers:
      Cookie: "{{ session_cookie }}"
    status_code: 200
  register: inbound_details_response
  failed_when: >-
    inbound_details_response.json is not defined or
    inbound_details_response.json.success != true

- name: Extract existing clients list
  ansible.builtin.set_fact:
    existing_clients: >-
      {{
        (inbound_details_response.json.obj.settings | from_json).clients
        | default([])
      }}

- name: Build a dictionary mapping email -> existing client
  ansible.builtin.set_fact:
    existing_clients_by_email: >-
      {{
        dict(existing_clients | map(attribute='email') | zip(existing_clients))
      }}

# ===========================================
#   GENERATE UUID FOR EACH CLIENT
# ===========================================
- name: Generate a random UUID for each client if not provided
  ansible.builtin.set_fact:
    generated_uuids: >-
      {{
        generated_uuids | default({}) | combine({
          item.name: item.uuid | default(lookup('pipe', 'uuidgen'))
        })
      }}
  loop: "{{ inbound_item.clients }}"
  loop_control:
    loop_var: item


# ===========================================
#   GET EXISTING CLIENTS FOR THIS INBOUND
# ===========================================
- name: Get current inbound details (to fetch existing clients)
  ansible.builtin.uri:
    url: "{{ ui_panel_url }}/panel/api/inbounds/get/{{ inbound_id }}"
    method: GET
    headers:
      Cookie: "{{ session_cookie }}"
    status_code: 200
  register: inbound_details_response
  failed_when: >-
    inbound_details_response.json is not defined or
    inbound_details_response.json.success != true

- name: Extract existing clients list (parse settings JSON string)
  ansible.builtin.set_fact:
    existing_clients: >-
      {{
        (inbound_details_response.json.obj.settings | from_json).clients
        | default([])
      }}

- name: Build a dictionary mapping email -> existing client
  ansible.builtin.set_fact:
    existing_clients_by_email: >-
      {{
        dict(existing_clients | map(attribute='email') | zip(existing_clients))
      }}

# ===========================================
#   GENERATE UUID FOR EACH CLIENT (all at once)
# ===========================================
- name: Generate a random UUID for each client if not provided
  ansible.builtin.set_fact:
    generated_uuids: >-
      {{
        generated_uuids | default({}) | combine({
          item.name: item.uuid | default(lookup('pipe', 'uuidgen'))
        })
      }}
  loop: "{{ inbound_item.clients }}"
  loop_control:
    loop_var: item

# ===========================================
#   PROCESS EACH CLIENT (using include_tasks with loop)
# ===========================================
- name: Process each client (add or update)
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/process_client.yaml"
  loop: "{{ inbound_item.clients }}"
  loop_control:
    loop_var: client_item
