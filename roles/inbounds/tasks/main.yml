- name: Start 3x‑UI panel service
  ansible.builtin.command:
    cmd: x-ui start
  become: true
  changed_when: true

- name: Retrieve 3x‑UI configuration settings
  ansible.builtin.shell: |
    echo "n" | x-ui settings
  become: true
  register: xui_settings_output
  changed_when: false

- name: Extract the webBasePath value
  ansible.builtin.set_fact:
    ui_panel_path: >-
      {{
        (xui_settings_output.stdout
        | regex_search('webBasePath:\s*(\S+)', '\1')
        | first
        | default('/'))
        | regex_replace('^/+|/+$', '')
      }}
  when: xui_settings_output is succeeded

- name: Build panel URL variable
  ansible.builtin.set_fact:
    ui_panel_url: "http://localhost:{{ ui_panel_port }}/{{ ui_panel_path }}"

- name: Login to 3x‑UI API and obtain session cookie
  uri:
    url: "{{ ui_panel_url }}/login"
    method: POST
    body:
      username: "{{ ui_panel_username }}"
      password: "{{ ui_panel_password }}"
    body_format: json
    status_code: 200
  register: login_response
  # no_log: yes

- name: Fail if login to 3x‑UI API was unsuccessful
  ansible.builtin.fail:
    msg: >-
      Login failed for user {{ ui_panel_username }}.
      API returned status {{ login_response.status }}.
      Message: {{ login_response.json.msg | default('(no message)') }}
  when: >
    login_response.status is defined
    and (login_response.status != 200
         or (login_response.json is defined
             and login_response.json.get('success', true) == false))

- name: Extract session cookie
  ansible.builtin.set_fact:
    session_cookie: "{{ login_response.set_cookie | regex_replace(';.*', '') }}"

- name: Add inbounds from host variables
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/add_inbound.yaml"
  loop: "{{ inbounds }}"
  loop_control:
    loop_var: inbound_item
