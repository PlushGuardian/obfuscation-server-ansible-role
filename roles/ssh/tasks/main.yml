---
- name: Check preconditions for SSH hardening
  tags:
    - ssh
    - security
  block:
    - name: Fail if password authentication is used for the Ansible connection
      ansible.builtin.assert:
        that:
          - ansible_password is not defined
          - ansible_ssh_pass is not defined
        fail_msg: >-
          This role requires SSH key authentication. Please use '--private-key'
          or ssh-agent and remove 'ansible_password'/'ansible_ssh_pass' from your
          inventory/vars.

    - name: Fail if running as root (root SSH will be disabled)
      ansible.builtin.assert:
        that: (ansible_user | default('')) != 'root'
        fail_msg: >-
          This role disables SSH access for root. Please run as a non-root user
          with sudo privileges.

    - name: Determine platform-specific ssh service name
      ansible.builtin.set_fact:
        ssh_hardening_service_name: "{{ 'sshd' if ansible_facts['os_family'] in ['RedHat', 'Suse'] else 'ssh' }}"

    - name: Look up the admin user's passwd entry
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Count non-empty, non-comment lines in the admin user's authorized_keys
      ansible.builtin.command:
        cmd: >-
          grep -c -v -e '^\s*$' -e '^\s*#'
          {{ ansible_facts.getent_passwd[ansible_user][4] }}/.ssh/authorized_keys
      register: ssh_hardening_key_count
      changed_when: false
      failed_when: false

    - name: Fail if the admin user has no usable authorized key
      ansible.builtin.assert:
        that: (ssh_hardening_key_count.stdout | default('0') | int) > 0
        fail_msg: >-
          No usable key found in ~{{ ansible_user }}/.ssh/authorized_keys.
          Disabling password authentication now would lock you out — deploy a
          key first.

- name: Apply SSH hardening
  become: true
  tags:
    - ssh
    - security
  block:
    - name: Find all override files in sshd_config.d
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        patterns: "*.conf"
      register: ssh_override_files

    - name: Comment out PasswordAuthentication, PermitRootLogin, and PermitEmptyPasswords in all override files
      ansible.builtin.replace:
        path: "{{ item.path }}"
        # Anchored to column 0 so directives inside indented `Match` blocks
        # are left untouched; (?i) makes the keyword match case-insensitively.
        regexp: '(?i)^((PasswordAuthentication|PermitRootLogin|PermitEmptyPasswords)\s+\S.*)$'
        replace: '# \1'
      loop: "{{ ssh_override_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Enforce key-only, no-root SSH access in the main sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '(?i)^#?\s*{{ item.key }}\b.*$'
        line: "{{ item.key }} {{ item.value }}"
        state: present
        backup: true
        validate: '/usr/sbin/sshd -t -f %s'
      loop:
        - { key: PasswordAuthentication, value: 'no' }
        - { key: PermitEmptyPasswords,   value: 'no' }
        - { key: PermitRootLogin,        value: 'no' }
      loop_control:
        label: "{{ item.key }}"
      notify: Restart ssh
