# ===========================================
#   CHECK IF INBOUND ALREADY EXISTS
# ===========================================
- name: Get existing inbounds from 3X-UI
  ansible.builtin.uri:
    url: "{{ x_ui_inbounds_panel_url }}/panel/api/inbounds/list"
    method: GET
    headers:
      Cookie: "{{ session_cookie }}"
    status_code: 200
  register: x_ui_inbounds_x_ui_inbounds_existing_inbounds_response
  failed_when: >-
    x_ui_inbounds_x_ui_inbounds_existing_inbounds_response.json is not defined or
    x_ui_inbounds_x_ui_inbounds_existing_inbounds_response.json.success != true

- name: Find inbound by remark
  ansible.builtin.set_fact:
    x_ui_inbounds_existing_inbound: >-
      {{
        x_ui_inbounds_x_ui_inbounds_existing_inbounds_response.json.obj
        | selectattr('remark', 'equalto', inbound_item.name)
        | first | default(None)
      }}

- name: Parse streamSettings and settings if inbound exists
  when: x_ui_inbounds_existing_inbound is not none
  block:
    - name: Parse streamSettings from JSON string
      ansible.builtin.set_fact:
        x_ui_inbounds_existing_stream_settings: "{{ x_ui_inbounds_existing_inbound.streamSettings | from_json }}"
      when: x_ui_inbounds_existing_inbound is not none

    - name: Parse settings from JSON string (though we might not need it for inbound update)
      ansible.builtin.set_fact:
        x_ui_inbounds_existing_settings: "{{ x_ui_inbounds_existing_inbound.settings | from_json }}"
      when: x_ui_inbounds_existing_inbound is not none

# ===========================================
#   GENERATE INBOUND-SPECIFIC VALUES (only if new)
# ===========================================
- name: Find an unused port in the range 10000-49151 (for new inbound)
  ansible.builtin.shell: |
    set -o pipefail
    while true; do
      PORT=$(shuf -i {{ port_range_start }}-{{ port_range_end }} -n 1)
      if ! ss -tuln | grep -q ":${PORT} " && ! ufw status | grep -q "${PORT}"; then
        echo $PORT
        break
      fi
    done
  register: x_ui_inbounds_port_finder
  changed_when: false
  become: true
  failed_when: x_ui_inbounds_port_finder.rc != 0 or x_ui_inbounds_port_finder.stderr != ""
  when: x_ui_inbounds_existing_inbound is none

- name: Set inbound port as fact (use existing port if inbound exists)
  ansible.builtin.set_fact:
    x_ui_inbounds_inbound_port: >-
      {{
        x_ui_inbounds_existing_inbound.port | default(x_ui_inbounds_port_finder.stdout | trim)
      }}

- name: Configure Reality settings based on host IP
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/configure_reality.yaml"

# ===========================================
#   BUILD JSONS (WITHOUT CLIENTS)
# ===========================================
- name: Build settings dictionary (empty clients)
  ansible.builtin.set_fact:
    x_ui_inbounds_settings_dict:
      clients: []          # clients will be handled separately
      decryption: "none"
      fallbacks: []

- name: Build streamSettings dictionary
  ansible.builtin.set_fact:
    x_ui_inbounds_stream_settings_dict:
      network: "{{ inbound_network }}"
      security: "reality"
      realitySettings:
        show: false
        xver: 0
        target: "{{ reality_destination }}"
        serverNames: "{{ reality_server_names }}"
        privateKey: "{{ reality_private_key }}"
        shortIds: "{{ reality_short_ids }}"
        minClientVer: ""
        maxClientVer: ""
        maxTimeDiff: 0
        settings:
          publicKey: "{{ reality_public_key }}"
      tcpSettings:
        acceptProxyProtocol: false
        header:
          type: "none"

- name: Convert settings and streamSettings to JSON strings
  ansible.builtin.set_fact:
    x_ui_inbounds_settings_string: "{{ x_ui_inbounds_settings_dict | to_json }}"
    x_ui_inbounds_stream_settings_string: "{{ x_ui_inbounds_stream_settings_dict | to_json }}"

- name: Construct final inbound payload (no clients)
  ansible.builtin.set_fact:
    x_ui_inbounds_payload:
      remark: "{{ inbound_item.name }}"
      enable: true
      protocol: "{{ inbound_protocol }}"
      listen: "{{ ansible_host }}"
      port: "{{ x_ui_inbounds_inbound_port | int }}"
      expiryTime: 0
      total: 0
      up: 0
      down: 0
      settings: "{{ x_ui_inbounds_settings_string }}"
      streamSettings: "{{ x_ui_inbounds_stream_settings_string }}"

# ===========================================
#   ADD OR UPDATE INBOUND
# ===========================================
- name: Add new inbound via 3X-UI API
  ansible.builtin.uri:
    url: "{{ x_ui_inbounds_panel_url }}/panel/api/inbounds/add"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      Content-Type: "application/json"
    body: "{{ x_ui_inbounds_payload | to_json }}"
    body_format: json
    status_code: 200
  register: x_ui_inbounds_add_response
  when: x_ui_inbounds_existing_inbound is none
  failed_when: >-
    x_ui_inbounds_add_response.json is not defined or
    x_ui_inbounds_add_response.json.success != true

- name: Allow the selected port through UFW (for new inbound)
  community.general.ufw:
    rule: allow
    port: "{{ x_ui_inbounds_port_finder.stdout | trim }}"
    proto: tcp
  become: true
  when: x_ui_inbounds_existing_inbound is none

- name: Update existing inbound via 3X-UI API
  ansible.builtin.uri:
    url: "{{ x_ui_inbounds_panel_url }}/panel/api/inbounds/update/{{ x_ui_inbounds_existing_inbound.id }}"
    method: POST
    headers:
      Cookie: "{{ session_cookie }}"
      Content-Type: "application/json"
    body: "{{ x_ui_inbounds_payload | to_json }}"
    body_format: json
    status_code: 200
  register: x_ui_inbounds_update_response
  when: x_ui_inbounds_existing_inbound is not none
  failed_when: >-
    x_ui_inbounds_update_response.json is not defined or
    x_ui_inbounds_update_response.json.success != true

- name: Set x_ui_inbounds_id fact for later client operations
  ansible.builtin.set_fact:
    x_ui_inbounds_id: >-
      {{
        (x_ui_inbounds_existing_inbound.id if x_ui_inbounds_existing_inbound is not none
         else x_ui_inbounds_add_response.json.obj.id)
      }}

# ===========================================
#   GET EXISTING CLIENTS FOR THIS INBOUND
# ===========================================
- name: Get current inbound details (to fetch existing clients)
  ansible.builtin.uri:
    url: "{{ x_ui_inbounds_panel_url }}/panel/api/inbounds/get/{{ x_ui_inbounds_id }}"
    method: GET
    headers:
      Cookie: "{{ session_cookie }}"
    status_code: 200
  register: x_ui_inbounds_details_response
  failed_when: >-
    x_ui_inbounds_details_response.json is not defined or
    x_ui_inbounds_details_response.json.success != true

- name: Extract existing clients list
  ansible.builtin.set_fact:
    x_ui_inbounds_existing_clients: >-
      {{
        (x_ui_inbounds_details_response.json.obj.settings | from_json).clients
        | default([])
      }}

- name: Build a dictionary mapping email -> existing client
  ansible.builtin.set_fact:
    x_ui_inbounds_existing_clients_by_email: >-
      {{
        dict(x_ui_inbounds_existing_clients | map(attribute='email') | zip(x_ui_inbounds_existing_clients))
      }}

# ===========================================
#   GENERATE UUID FOR EACH CLIENT
# ===========================================
- name: Generate a random UUID for each client if not provided
  ansible.builtin.set_fact:
    x_ui_inbounds_generated_uuids: >-
      {{
        x_ui_inbounds_generated_uuids | default({}) | combine({
          item.name: item.uuid | default(lookup('pipe', 'uuidgen'))
        })
      }}
  loop: "{{ inbound_item.clients }}"
  loop_control:
    loop_var: item


# ===========================================
#   GET EXISTING CLIENTS FOR THIS INBOUND
# ===========================================
- name: Get current inbound details (to fetch existing clients)
  ansible.builtin.uri:
    url: "{{ x_ui_inbounds_panel_url }}/panel/api/inbounds/get/{{ x_ui_inbounds_id }}"
    method: GET
    headers:
      Cookie: "{{ session_cookie }}"
    status_code: 200
  register: x_ui_inbounds_details_response
  failed_when: >-
    x_ui_inbounds_details_response.json is not defined or
    x_ui_inbounds_details_response.json.success != true

- name: Extract existing clients list (parse settings JSON string)
  ansible.builtin.set_fact:
    x_ui_inbounds_existing_clients: >-
      {{
        (x_ui_inbounds_details_response.json.obj.settings | from_json).clients
        | default([])
      }}

- name: Build a dictionary mapping email -> existing client
  ansible.builtin.set_fact:
    x_ui_inbounds_existing_clients_by_email: >-
      {{
        dict(x_ui_inbounds_existing_clients | map(attribute='email') | zip(x_ui_inbounds_existing_clients))
      }}

# ===========================================
#   GENERATE UUID FOR EACH CLIENT (all at once)
# ===========================================
- name: Generate a random UUID for each client if not provided
  ansible.builtin.set_fact:
    x_ui_inbounds_generated_uuids: >-
      {{
        x_ui_inbounds_generated_uuids | default({}) | combine({
          item.name: item.uuid | default(lookup('pipe', 'uuidgen'))
        })
      }}
  loop: "{{ inbound_item.clients }}"
  loop_control:
    loop_var: item

# ===========================================
#   PROCESS EACH CLIENT (using include_tasks with loop)
# ===========================================
- name: Process each client (add or update)
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/process_client.yaml"
  loop: "{{ inbound_item.clients }}"
  loop_control:
    loop_var: client_item
