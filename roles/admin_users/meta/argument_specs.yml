---
argument_specs:
  main:
    short_description: Manages admin user accounts, sudo access, and authorized SSH keys
    options:
      admin_users_list:
        type: list
        elements: dict
        default: []
        description: >-
          Desired set of admin users. Any existing sudo-group member not
          present here (and not root or the current connection user) is
          removed. Written assuming tasks/main.yml is fixed to reference
          admin_users_list consistently — see note below.
        options:
          username:
            type: str
            required: true
            description: Login name for the account.
          ssh_key:
            type: str
            required: true
            no_log: true
            description: Public SSH key installed as the account's sole authorized key.
          shell:
            type: str
            default: /bin/bash
            description: Login shell for the account.
      admin_users_sudo_group_name:
        type: str
        default: sudo
        description: Name of the group granted sudo access and used to detect stale admins.
      admin_users_purge_home:
        type: bool
        default: true
        description: Whether to delete the home directory when removing a stale admin user.
      admin_users_passwordless_sudo:
        type: bool
        default: true
        description: Whether members of admin_users_sudo_group_name get NOPASSWD sudo.
