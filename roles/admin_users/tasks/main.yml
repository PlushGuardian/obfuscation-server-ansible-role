---
# ------------------------------------------------------------------
#  REMOVE STALE ADMINS
# ------------------------------------------------------------------
- name: Get current members of sudo group
  ansible.builtin.getent:
    database: group
    key: sudo
  register: admin_users_sudo_group
  become: true
  tags:
    - admin_users
    - security

- name: Compute users to remove (sudo group members not in admin list)
  ansible.builtin.set_fact:
    admin_users_current_admins: "{{ admin_users_sudo_group.ansible_facts.getent_group.sudo[2].split(',') | default([]) }}"
    admin_users_new_admins: "{{ admin_users | map(attribute='username') | list }}"
  tags:
    - admin_users
    - security

- name: Remove stale admin users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ admin_users_current_admins }}"
  when:
    - item not in admin_users_new_admins
    - item != 'root'
    - item != ansible_user
  become: true
  tags:
    - admin_users
    - security

# ------------------------------------------------------------------
#  ADD NEW ADMINS
# ------------------------------------------------------------------
- name: Ensure admin users exist
  ansible.builtin.user:
    name: "{{ item.username }}"
    state: present
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
  loop: "{{ admin_users }}"
  become: true
  tags:
    - admin_users
    - security

- name: Set authorized SSH keys for admin users
  ansible.posix.authorized_key:
    user: "{{ item.username }}"
    key: "{{ item.ssh_key | replace('\n', '') }}"
    state: present
    exclusive: true
  loop: "{{ admin_users_new_admins }}"
  become: true
  tags:
    - admin_users
    - security

- name: Allow passwordless sudo for admin group
  ansible.builtin.copy:
    content: "%sudo ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/90-admin-nopasswd
    validate: visudo -cf %s
    mode: '0440'
  become: true
  tags:
    - admin_users
    - security
