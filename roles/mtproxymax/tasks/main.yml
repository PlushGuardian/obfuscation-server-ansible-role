- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - build-essential
      - libssl-dev
      - zlib1g-dev
    state: present
  become: true

- name: Open firewall port for MTProto
  community.general.ufw:
    rule: allow
    port: "{{ mtproxy_port }}"
    proto: tcp
  become: true

- name: Set mtproxymax_private_ip fact
  ansible.builtin.set_fact:
    mtproxymax_private_ip: "{{ ansible_default_ipv4.address }}"

- name: Display IP configuration
  ansible.builtin.debug:
    msg:
      - "Public IP (from inventory): {{ ansible_host }}"
      - "Private IP (local interface): {{ mtproxymax_private_ip }}"
      - "NAT will be configured: {{ ansible_host != mtproxymax_private_ip }}"


## Add docker installation

# ================================================
# 2. Install MTProxyMax
# ================================================

- name: Check if MTProxyMax is already installed
  ansible.builtin.command: which mtproxymax
  register: mtproxymax_check
  failed_when: false
  changed_when: false

- name: Download MTProxyMax installer
  ansible.builtin.get_url:
    url: "{{ mtproxymax_installer_url }}"
    dest: /tmp/mtproxymax-install.sh
    mode: '0755'
  become: true
  when: mtproxymax_check.rc != 0

- name: Install MTProxyMax non‑interactively using a wrapper script
  ansible.builtin.script: run_installation_interactive.sh
  become: true
  environment:
    MTPROXY_PORT: "{{ mtproxy_port }}"
    MTPROXYMAX_FAKETLS_DOMAIN: "{{ mtproxy_faketls_domain | default('yandex.com') }}"
    MTPROXY_CPU_LIMIT: "{{ mtproxy_cpu_limit | default(0.2) }}"
    MTPROXY_MEMORY_LIMIT: "{{ mtproxy_memory_limit | default('300m') }}"
    TERM: linux   # helps some prompts behave as if interactive
  args:
    executable: bash
  timeout: 600
  when: mtproxymax_check.rc != 0

# ================================================
# 3. NAT Configuration (Idempotent & Dynamic)
# ================================================
- name: Get current NAT configuration from MTProxyMax
  ansible.builtin.command: mtproxymax config get nat
  register: mtproxymax_current_nat_config
  changed_when: false
  failed_when: false

- name: Parse current NAT value
  ansible.builtin.set_fact:
    mtproxymax_current_nat_value: "{{ mtproxymax_current_nat_config.stdout | trim if mtproxymax_current_nat_config.stdout != '' else '' }}"

- name: Determine desired NAT configuration
  ansible.builtin.set_fact:
    mtproxymax_desired_nat_value: "{{ mtproxymax_private_ip + ':' + ansible_host if ansible_host != mtproxymax_private_ip else '' }}"

- name: Update NAT configuration if needed
  ansible.builtin.command: "mtproxymax config set nat {{ mtproxymax_desired_nat_value }}"
  when:
    - mtproxymax_desired_nat_value != mtproxymax_current_nat_value
  changed_when: true
  notify: Restart mtproxymax
  become: true

# ================================================
# 4. Configure Automatic Updates (Cron Job)
# ================================================
- name: Setup daily cron job to update proxy-multi.conf
  ansible.builtin.cron:
    name: "Update Telegram MTProto config"
    minute: "{{ mtproxy_config_update_minute }}"
    hour: "{{ mtproxy_config_update_hour }}"
    job: "curl -s https://core.telegram.org/getProxyConfig -o /opt/MTProxy/proxy-multi.conf && systemctl restart mtproxymax"
    user: root
    state: present
  become: true

# ================================================
# 5. Declarative User Management with MTProxyMax CLI
# ================================================
- name: Ensure all users exist (create if missing, ignore existing)
  ansible.builtin.command: "mtproxymax secret add {{ item.name }}"
  loop: "{{ mtproxy_users }}"
  register: mtproxymax_user_add_result
  changed_when: "'created' in mtproxymax_user_add_result.stdout"   # Adjust based on actual success message
  failed_when:
    - mtproxymax_user_add_result.rc != 0
    - "'already exists' not in mtproxymax_user_add_result.stderr"
  become: true

- name: Apply per-user limits
  ansible.builtin.command: >
    mtproxymax secret setlimits {{ item.name }}
    {{ item.max_conns | default(0) }}
    {{ item.max_ips | default(0) }}
    {{ item.quota | default('0') }}
    {{ item.expires | default('') }}
  loop: "{{ mtproxy_users }}"
  when:
    - item.max_conns is defined or item.max_ips is defined or item.quota is defined or item.expires is defined
  changed_when: true
  become: true

- name: Generate proxy links for users
  ansible.builtin.command: "mtproxymax secret link {{ item.name }}"
  loop: "{{ mtproxy_users }}"
  register: mtproxymax_user_links
  changed_when: false
  become: true

- name: Save user links to local file
  ansible.builtin.copy:
    content: |
      {% for result in mtproxymax_user_links.results %}
      User: {{ result.item.name }} | Link: {{ result.stdout }}
      {% endfor %}
    dest: "./mtproxy_user_links_{{ inventory_hostname }}.txt"
    mode: '0600'
  delegate_to: localhost
  run_once: true
  when: mtproxymax_user_links.results is defined and mtproxymax_user_links.results | length > 0


# # ================================================
# # 6. Final Service Management
# # ================================================
- name: Ensure MTProxyMax service is running and enabled
  ansible.builtin.systemd:
    name: mtproxymax
    state: started
    enabled: true
    daemon_reload: true
  become: true
