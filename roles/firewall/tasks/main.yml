---
- name: Ensure UFW is installed
  ansible.builtin.package:
    name: ufw
    state: present
  become: true
  when: firewall_ufw_install | bool
  tags:
    - firewall
    - security

- name: Set default UFW policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  become: true
  loop:
    - { direction: incoming, policy: "{{ firewall_default_incoming_policy }}" }
    - { direction: outgoing, policy: "{{ firewall_default_outgoing_policy }}" }
  loop_control:
    label: "{{ item.direction }} -> {{ item.policy }}"
  notify: reload ufw
  tags:
    - firewall
    - security

- name: Block ICMP echo-request (ping) in ufw before.rules
  ansible.builtin.replace:
    path: "{{ firewall_before_rules_path }}"
    regexp: '^(-A {{ item }} -p icmp --icmp-type echo-request -j)\s*ACCEPT'
    replace: '\1 DROP'
    backup: true
  become: true
  diff: true
  loop: "{{ firewall_block_icmp_chains }}"
  notify: reload ufw
  tags:
    - firewall
    - security

# IMPORTANT: this task must run before "Ensure UFW is enabled" below.
# ansible_port is very likely the SSH port Ansible is connected over —
# allowing it first prevents locking ourselves out when the default
# incoming policy is deny.
- name: Allow SSH / Ansible control port
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port }}"
    proto: tcp
    comment: "Ansible-managed: SSH/control access"
  become: true
  tags:
    - firewall
    - security

- name: Allow additional application ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "Ansible-managed extra rule"
  become: true
  loop: "{{ firewall_extra_allow_rules }}"
  when: firewall_extra_allow_rules | length > 0
  tags:
    - firewall
    - security

- name: Ensure UFW is enabled
  community.general.ufw:
    state: enabled
  become: true
  tags:
    - firewall
    - security
