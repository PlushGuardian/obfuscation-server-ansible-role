---
- name: Check current UFW status
  ansible.builtin.command: ufw status
  register: firewall_ufw_status
  check_mode: false
  changed_when: false
  tags:
    - firewall
    - security

- name: Block ICMP echo-request (ping) in the INPUT chain
  ansible.builtin.replace:
    path: /etc/ufw/before.rules
    regexp: '^(-A ufw-before-input -p icmp --icmp-type echo-request -j)\s*ACCEPT'
    replace: '\1 DROP'
    backup: true
  diff: true
  become: true
  notify: reload ufw
  tags:
    - firewall
    - security

- name: Block ICMP echo-request (ping) in the FORWARD chain
  ansible.builtin.replace:
    path: /etc/ufw/before.rules
    regexp: '^(-A ufw-before-forward -p icmp --icmp-type echo-request -j)\s*ACCEPT'
    replace: '\1 DROP'
    backup: false
  diff: true
  become: true
  notify: reload ufw
  tags:
    - firewall
    - security

- name: Allow traffic on SSH / Ansible port
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port }}"
    proto: tcp
  become: true
  tags:
    - firewall
    - security

- name: Ensure UFW is enabled
  community.general.ufw:
    state: enabled
  become: true
  tags:
    - firewall
    - security
