
- name: Backup UFW before.rules
  copy:
    src: /etc/ufw/before.rules
    dest: /etc/ufw/before.rules.bak
    remote_src: yes
    backup: yes
  become: yes

- name: Block ICMP echo-request (ping) in INPUT chain
  replace:
    path: /etc/ufw/before.rules
    regexp: '^(-A ufw-before-input -p icmp --icmp-type echo-request -j) ACCEPT$'
    replace: '\1 DROP'
  become: yes

- name: Block ICMP echo-request (ping) in FORWARD chain
  replace:
    path: /etc/ufw/before.rules
    regexp: '^(-A ufw-before-forward -p icmp --icmp-type echo-request -j) ACCEPT$'
    replace: '\1 DROP'
  become: yes





- name: Check current UFW status
  ansible.builtin.command: ufw status
  register: ufw_status
  check_mode: no
  changed_when: false
  tags:
    - firewall

- name: Block ICMP echo-request (ping) in the INPUT chain
  ansible.builtin.replace:
    path: /etc/ufw/before.rules
    regexp: '^(-A ufw-before-input -p icmp --icmp-type echo-request -j)\s*ACCEPT'
    replace: '\1 DROP'
    backup: yes
  diff: yes
  become: yes
  notify: reload ufw
  tags:
    - firewall

- name: Block ICMP echo-request (ping) in the FORWARD chain
  ansible.builtin.replace:
    path: /etc/ufw/before.rules
    regexp: '^(-A ufw-before-forward -p icmp --icmp-type echo-request -j)\s*ACCEPT'
    replace: '\1 DROP'
    backup: no
  diff: yes
  become: yes
  notify: reload ufw
  tags:
    - firewall

- name: Allow traffic on SSH / Ansible port
  ansible.builtin.ufw:
    rule: allow
    port: "{{ ansible_port }}"
    proto: tcp
  become: yes
  tags:
    - firewall

- name: Ensure UFW is enabled
  ansible.builtin.ufw:
    state: enabled
  become: yes
  tags:
    - firewall
