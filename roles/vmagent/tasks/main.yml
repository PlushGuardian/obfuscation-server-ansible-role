---
- name: Ensure vmagent config directory exists
  ansible.builtin.file:
    path: /etc/vmagent
    state: directory
    mode: "0755"
  become: true

- name: Configure vmagent to scrape node_exporter and write to central VictoriaMetrics
  ansible.builtin.template:
    src: "{{ role_path }}/templates/vmagent_config.yaml.j2"
    dest: /etc/vmagent/scrape.yml
    mode: "0644"
  become: true

- name: Run vmagent container
  community.docker.docker_container:
    name: vmagent
    image: victoriametrics/vmagent:latest
    state: started
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - /etc/vmagent/scrape.yml:/etc/vmagent/scrape.yml
    command:
      - '-promscrape.config=/etc/vmagent/scrape.yml'
      - '-remoteWrite.url=http://{{ storage_server_fqdn }}:8428/api/v1/write'
      - '-remoteWrite.basicAuth.username={{ vm_user }}'
      - '-remoteWrite.basicAuth.password={{ vm_password }}'
      - '-httpListenAddr=:{{ vmagent_port }}'
      - '-remoteWrite.label=node={{ inventory_hostname }}'
  become: true
