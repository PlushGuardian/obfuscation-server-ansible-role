---
argument_specs:
  main:
    short_description: Runs vmagent to scrape node_exporter and remote-write to VictoriaMetrics.
    options:
      vm_server_fqdn:
        type: str
        required: true
        description: Hostname of the central VictoriaMetrics server to remote-write to.
      vm_user:
        type: str
        required: true
        description: >-
          Basic-auth username for remote-write. Must match the target
          VictoriaMetrics server's victoriametrics_user.
      vm_password:
        type: str
        required: true
        no_log: true
        description: >-
          Basic-auth password for remote-write. Must match the target
          VictoriaMetrics server's victoriametrics_password.
      vmagent_port:
        type: int
        default: 8429
        description: Port vmagent's own HTTP listener binds to.
      node_exporter_port:
        type: int
        default: 9100
        description: Port the local node_exporter listens on.
