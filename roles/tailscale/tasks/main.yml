---
- name: Download Tailscale install script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/install-tailscale.sh
    mode: "0755"
  tags:
    - tailscale
    - monitoring

- name: Run Tailscale installer
  ansible.builtin.command: /tmp/install-tailscale.sh
  args:
    creates: /usr/bin/tailscale
  become: true
  tags:
    - tailscale
    - monitoring

- name: Authenticate Tailscale with auth key
  ansible.builtin.command: tailscale up --accept-routes
  environment:
    TS_AUTHKEY: "{{ tailscale_auth_key }}"
  changed_when: false
  become: true
  no_log: true
  tags: [tailscale, monitoring]

# Retrieve and persist Tailscale IP for later use
- name: Get Tailscale IP
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip_cmd
  changed_when: false
  tags:
    - tailscale
    - monitoring

- name: Set fact for Tailscale IP
  ansible.builtin.set_fact:
    tailscale_ip: "{{ tailscale_ip_cmd.stdout }}"
  tags:
    - tailscale
    - monitoring
