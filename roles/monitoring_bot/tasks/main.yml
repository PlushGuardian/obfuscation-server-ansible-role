- name: Create monitoring-bot system user
  user:
    name: monitoring-bot
    system: yes
    shell: /usr/sbin/nologin
    create_home: no
    home: /opt/monitoring-bot
  become: yes

- name: Create application directory
  file:
    path: /opt/monitoring-bot
    state: directory
    owner: monitoring-bot
    group: monitoring-bot
    mode: '0755'
  become: yes

- name: Install boto3 into monitor-bot user's local site-packages
  pip:
    name: boto3
    extra_args: --user --break-system-packages
  environment:
    HOME: /opt/monitor-bot
  become: yes
  become_user: root    # Explicit, though root is default

- name: Copy S3 test script
  copy:
    src: files/main.py
    dest: /opt/monitoring-bot/main.py
    owner: monitoring-bot
    group: monitoring-bot
    mode: '0750'   # Restrictive permissions
  become: yes


- name: Deploy systemd service unit file
  template:
    src: templates/monitoring-bot.service.j2
    dest: /etc/systemd/system/monitoring-bot.service
    owner: root
    group: root
    mode: '0644'
  notify: systemd reload
  become: yes

- name: Execute S3 test (write file to bucket)
  systemd:
    name: monitoring-bot.service
    state: started
  register: s3_test_result
  ignore_errors: yes

- name: Display S3 test result
  debug:
    msg: "S3 test output: {{ s3_test_result }}"

- name: Check journal for S3 test output
  command: journalctl -u monitoring-bot.service --no-pager -n 5
  register: journal_output
  changed_when: false

- name: Show journal output
  debug:
    var: journal_output.stdout_lines
