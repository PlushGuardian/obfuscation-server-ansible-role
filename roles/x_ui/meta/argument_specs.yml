---
argument_specs:
  main:
    short_description: >-
      Installs and configures the 3x-ui panel. This spec covers structural
      validation (required/type); it does not replace the empty-string
      checks already in tasks/main.yml, since those also gate at runtime
      after install-state facts are gathered.
    options:
      x_ui_panel_username:
        type: str
        required: true
        description: Admin username for the 3x-ui panel.
      x_ui_panel_password:
        type: str
        required: true
        no_log: true
        description: Admin password for the 3x-ui panel.
      x_ui_web_base_path:
        type: str
        required: true
        description: URL base path the panel is served under.
      x_ui_panel_port:
        type: int
        default: 2053
        description: Port the 3x-ui panel listens on; opened in UFW by this role.
      x_ui_panel_acme_port:
        type: int
        default: 80
        description: Port used for ACME/Let's Encrypt HTTP challenges; opened in UFW by this role.
      x_ui_version:
        type: str
        default: "3.5.0"
        description: >-
          Desired 3x-ui version. The role refuses to downgrade if an
          installed version is newer than this.
