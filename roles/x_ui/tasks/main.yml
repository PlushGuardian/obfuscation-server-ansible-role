# =========================================
#        UPDATE WEB PAGE CREDENTIALS
# =========================================

- name: Compute desired x-ui credentials fingerprint
  ansible.builtin.set_fact:
    x_ui_creds_fingerprint: "{{ (x_ui_panel_username + x_ui_panel_password + x_ui_panel_port | string) | hash('sha256') }}"
  no_log: true
  tags: [x_ui, security]

- name: Read stored credentials fingerprint, if any
  ansible.builtin.slurp:
    src: /etc/x-ui/.ansible_creds_fingerprint
  register: x_ui_stored_fingerprint_raw
  become: true
  failed_when: false
  tags: [x_ui, security]

- name: Determine whether credentials actually changed
  ansible.builtin.set_fact:
    x_ui_creds_changed: >-
      {{ x_ui_stored_fingerprint_raw.content is not defined
         or (x_ui_stored_fingerprint_raw.content | b64decode | trim) != x_ui_creds_fingerprint }}
  tags: [x_ui, security]

- name: Set panel port, username, and password (only when they changed)
  ansible.builtin.command: >
    /usr/bin/x-ui setting
    -username {{ x_ui_panel_username }}
    -password {{ x_ui_panel_password }}
    -port {{ x_ui_panel_port }}
  become: true
  no_log: true
  when: x_ui_creds_changed
  notify: Restart x-ui
  tags: [x_ui, security]

- name: Persist the new credentials fingerprint
  ansible.builtin.copy:
    content: "{{ x_ui_creds_fingerprint }}"
    dest: /etc/x-ui/.ansible_creds_fingerprint
    mode: "0600"
    owner: root
  become: true
  no_log: true
  when: x_ui_creds_changed
  tags: [x_ui, security]
